<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><meta name="apple-mobile-web-app-capable" content="yes"><title>Oráculo de Batalha</title><style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');:root{--bg:#080a0d;--panel:#111419;--card:#171a20;--line:#282d35;--text:#f1f4f7;--muted:#8f98a5;--accent:#55d66b;--blue:#3da5ff;--red:#ff4b4b;--purple:#b54cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#161a21 0,#080a0d 42%);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding-bottom:90px}header{padding:24px 16px 14px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:rgba(8,10,13,.94);backdrop-filter:blur(14px)}.logo{font-size:27px;font-weight:700;letter-spacing:2px}.subtitle{color:var(--muted);font-size:13px;letter-spacing:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:#101318;padding:4px;border-radius:14px;border:1px solid var(--line)}.tab{padding:11px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:#22272e;color:white}main{padding:16px}.section{display:none}.section.active{display:block}.panel{background:rgba(20,23,28,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 12px 35px #0005}h2{margin:0 0 14px;font-size:20px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input{width:100%;background:#0d1014;color:var(--text);border:1px solid #303640;border-radius:11px;padding:12px;outline:none}input:focus{border-color:var(--blue)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{padding:11px 14px;border-radius:11px;background:#252a31;color:white;font-weight:700}.btn.primary{background:var(--accent);color:#071008}.btn.blue{background:var(--blue);color:#06111c}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}.btn.gray{background:#30353d}.btn.small{padding:8px 10px;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:40px 15px}.character{background:linear-gradient(145deg,#1b1f25,#13161b);border:1px solid #2c323b;border-radius:20px;padding:16px;margin-bottom:14px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:25px;font-weight:700}.initiative{color:var(--blue);font-size:17px;font-weight:700}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.barwrap{background:#0d1014;border-radius:12px;padding:10px}.barhead{display:flex;justify-content:space-between;margin-bottom:7px;font-size:14px}.bar{height:10px;background:#282d35;border-radius:99px;overflow:hidden}.fill{height:100%;transition:.25s}.hp{background:var(--red)}.mp{background:var(--blue)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0d1014;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:12px}.combat{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.log{font-size:13px;color:var(--muted);max-height:120px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #1f232a}footer{position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,13,.95);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;backdrop-filter:blur(14px)}footer button{flex:1}@media(max-width:500px){.grid3{grid-template-columns:1fr 1fr}.bars{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.logo{font-size:23px}}.resistance{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.res-title{font-weight:700;margin-bottom:9px}.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.res-btn{background:#20262e;color:#fff;border:1px solid #343b45;padding:10px 6px;border-radius:10px;font-weight:700}.res-btn span{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.roll-result{margin-top:9px;background:#0d1014;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:14px}.roll-result strong{color:var(--blue)}
.dice-panel{background:linear-gradient(145deg,#151920,#0e1115);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.dice-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.die{position:relative;min-height:92px;border-radius:15px;border:2px solid transparent;color:#fff;background:#20252c;font-weight:700;transition:.18s;overflow:hidden}
.die b{display:block;font-size:27px;line-height:1}.die span{display:block;font-size:12px;opacity:.8;margin-top:4px}
.die.selected{transform:translateY(-2px);box-shadow:0 0 0 2px #fff5,0 8px 22px #0007}
.d4{background:linear-gradient(145deg,#8b5cf6,#5b21b6)}.d6{background:linear-gradient(145deg,#ef4444,#991b1b)}
.d8{background:linear-gradient(145deg,#f59e0b,#b45309)}.d10{background:linear-gradient(145deg,#10b981,#047857)}
.d12{background:linear-gradient(145deg,#06b6d4,#155e75)}.d20{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.d100{background:linear-gradient(145deg,#ec4899,#9d174d)}
.color-row{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 14px}
.color{width:32px;height:32px;border-radius:50%;border:3px solid #ffffff20}.color.selected{border-color:#fff;box-shadow:0 0 0 2px #fff5}
.c-red{background:#ef4444}.c-blue{background:#3b82f6}.c-green{background:#22c55e}.c-purple{background:#a855f7}.c-gold{background:#f59e0b}.c-cyan{background:#06b6d4}.c-pink{background:#ec4899}.c-white{background:#e5e7eb}
.roll-big{text-align:center;padding:20px 12px;margin:14px 0;background:#090c10;border:1px solid var(--line);border-radius:16px}
.roll-number{font-size:58px;font-weight:700;line-height:1}.roll-label{color:var(--muted);margin-top:4px}
.roll-history{max-height:190px;overflow:auto}.roll-history div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #20242b;color:#cbd1d9}
.dice-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.dice-options{grid-template-columns:repeat(2,1fr)}}

.d2{background:linear-gradient(145deg,#64748b,#334155)}
.d3{background:linear-gradient(145deg,#14b8a6,#0f766e)}
.digital-dice{position:relative}
.digital-dice .roll-number{font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(61,165,255,.35)}

.die{min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.die-icon{font-size:31px;line-height:1;height:34px;display:block;text-shadow:0 4px 12px rgba(0,0,0,.28)}
.die b{font-size:18px;letter-spacing:.5px}.die span:not(.die-icon){font-size:11px}
.die.selected{border-color:#fff8}
.dice-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.control-box{background:#0d1014;border:1px solid var(--line);border-radius:14px;padding:10px}
.control-box label{margin:0 0 7px}
.stepper{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.stepper button{height:42px;border-radius:10px;background:#252b33;color:#fff;font-size:23px}
.stepper strong{text-align:center;font-size:22px}
.bonus-input{display:grid;grid-template-columns:25px 1fr;align-items:center}
.bonus-input span{text-align:center;color:var(--accent);font-size:20px;font-weight:700}
.bonus-input input{height:42px;text-align:center;font-size:18px}
.roll-formula{font-size:14px;color:var(--muted);letter-spacing:1px;margin-bottom:5px}
.roll-parts{margin-top:11px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.roll-big.rolling {
  animation: diceShake .08s linear infinite, diceGlow .7s ease-in-out infinite alternate;
  transform-origin: center;
}
.roll-big.rolling .roll-number {
  animation: numberPulse .08s linear infinite;
}
@keyframes diceShake {
  0% { transform: rotate(-1deg) scale(1.01); }
  50% { transform: rotate(1deg) scale(1.045); }
  100% { transform: rotate(-1deg) scale(1.01); }
}
@keyframes diceGlow {
  from { box-shadow: 0 0 0 rgba(61,165,255,0), inset 0 0 0 rgba(61,165,255,0); }
  to { box-shadow: 0 0 28px rgba(61,165,255,.22), inset 0 0 22px rgba(61,165,255,.08); }
}
@keyframes numberPulse {
  0% { opacity:.65; transform:scale(.94); }
  50% { opacity:1; transform:scale(1.08); }
  100% { opacity:.65; transform:scale(.94); }
}
.roll-part.reveal {
  animation: partReveal .28s ease-out both;
}
@keyframes partReveal {
  from { opacity:0; transform:translateY(8px) scale(.8); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.roll-part{background:#20262e;border:1px solid #343b45;border-radius:8px;padding:5px 8px;font-size:13px}
</style></head><body><div class="app"><header><div class="logo">⚔ ORÁCULO DE BATALHA</div><div class="subtitle">MESA DE RPG • CONTROLE DE COMBATE</div><div class="tabs">
  <button class="tab active" data-tab="players">JOGADORES</button>
  <button class="tab" data-tab="create">NOVO PERSONAGEM</button>
  <button class="tab" data-tab="dice">DADOS</button>
</div></header>
<style>
.online-panel{background:linear-gradient(145deg,#101820,#0d1116);border:1px solid #2d3946;border-radius:18px;padding:14px 16px;margin:14px 16px 0;box-shadow:0 10px 30px #0004}
.online-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.online-title{font-weight:700;font-size:17px}.online-status{font-size:12px;color:#8f98a5}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}
.online-dot.on{background:#55d66b;box-shadow:0 0 10px #55d66b}.online-dot.off{background:#ff4b4b}.online-actions{display:flex;gap:6px}
.online-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;margin-top:10px}
.online-grid input{text-transform:uppercase;letter-spacing:2px}
.online-room{margin-top:10px;padding:9px 10px;border-radius:10px;background:#0a0d11;border:1px solid #242c35;color:#b9c0c9;font-size:12px}
.online-room b{color:#fff}.online-people{margin-top:8px;color:#8f98a5;font-size:12px}
.sync-flash{animation:syncFlash .55s ease-out}
@keyframes syncFlash{0%{box-shadow:0 0 0 rgba(85,214,107,0)}40%{box-shadow:0 0 25px rgba(85,214,107,.28)}100%{box-shadow:0 0 0 rgba(85,214,107,0)}}
@media(max-width:500px){.online-grid{grid-template-columns:1fr}}
</style>
<div class="online-panel">
  <div class="online-top">
    <div>
      <div class="online-title">🌐 Mesa Online</div>
      <div class="online-status"><span id="onlineDot" class="online-dot off"></span><span id="onlineStatus">Desconectado</span></div>
    </div>
    <div style="display:flex;gap:6px"><button class="btn small gray" id="copyRoomBtn" style="display:none">Copiar</button><button class="btn small gray" id="leaveRoomBtn" style="display:none">Sair</button></div>
  </div>
  <div class="online-grid">
    <input id="roomCode" maxlength="12" placeholder="CÓDIGO DA SALA">
    <button class="btn blue" id="connectRoomBtn">Conectar</button>
  </div>
  <div class="online-room" id="onlineRoomInfo">Nenhuma sala conectada.</div>
  <div class="online-people" id="onlinePeople">👥 0 conectado(s)</div>
</div><main><section id="players" class="section active"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Iniciativa</h2><button class="btn small blue" id="sortBtn">↕ Ordenar</button></div><div id="playerList"></div></section><section id="create" class="section"><div class="panel"><h2>✦ Criar personagem</h2><label>Nome</label><input id="name" placeholder="Ex.: Eryndor"><div class="grid2"><div><label>Classe</label><input id="class" placeholder="Ex.: Arqueiro"></div><div><label>Raça</label><input id="race" placeholder="Ex.: Humano"></div></div><div class="grid3"><div><label>PV Máx.</label><input id="hp" type="number" value="45"></div><div><label>Mana Máx.</label><input id="mp" type="number" value="25"></div><div><label>Iniciativa</label><input id="init" type="number" value="10"></div></div><div class="grid3"><div><label>Defesa</label><input id="def" type="number" value="10"></div><div><label>Fortitude</label><input id="fort" type="number" value="0"></div><div><label>Reflexos</label><input id="ref" type="number" value="0"></div></div><label>Vontade</label><input id="will" type="number" value="0"><div class="row" style="margin-top:16px"><button class="btn primary" id="createBtn">＋ Cadastrar</button><button class="btn gray" id="clearBtn">Limpar</button></div></div></section>
<section id="dice" class="section">
  <div class="dice-panel">
    <h2>🎲 Dados</h2>
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px">Escolha o dado e uma cor para rolar.</div>

    <div class="dice-options">
      <button class="die d2 selected" data-sides="2"><span class="die-icon">◈</span><b>D2</b><span>2 faces</span></button>
      <button class="die d3" data-sides="3"><span class="die-icon">◇</span><b>D3</b><span>3 faces</span></button>
      <button class="die d4" data-sides="4"><span class="die-icon">◆</span><b>D4</b><span>4 faces</span></button>
      <button class="die d6" data-sides="6"><span class="die-icon">⬡</span><b>D6</b><span>6 faces</span></button>
      <button class="die d8" data-sides="8"><span class="die-icon">⬢</span><b>D8</b><span>8 faces</span></button>
      <button class="die d10" data-sides="10"><span class="die-icon">◇</span><b>D10</b><span>10 faces</span></button>
      <button class="die d12" data-sides="12"><span class="die-icon">⬟</span><b>D12</b><span>12 faces</span></button>
      <button class="die d20" data-sides="20"><span class="die-icon">✦</span><b>D20</b><span>20 faces</span></button>
      <button class="die d100" data-sides="100"><span class="die-icon">%</span><b>D100</b><span>percentual</span></button>
    </div>

    <div style="margin-top:16px;font-weight:700">Cor do dado</div>
    <div class="color-row">
      <button class="color c-red" data-color="Vermelho" title="Vermelho"></button>
      <button class="color c-blue selected" data-color="Azul" title="Azul"></button>
      <button class="color c-green" data-color="Verde" title="Verde"></button>
      <button class="color c-purple" data-color="Roxo" title="Roxo"></button>
      <button class="color c-gold" data-color="Dourado" title="Dourado"></button>
      <button class="color c-cyan" data-color="Ciano" title="Ciano"></button>
      <button class="color c-pink" data-color="Rosa" title="Rosa"></button>
      <button class="color c-white" data-color="Branco" title="Branco"></button>
    </div>

    <div class="dice-controls">
      <div class="control-box">
        <label for="diceQty">Quantidade</label>
        <div class="stepper">
          <button type="button" id="qtyMinus">−</button>
          <strong id="diceQtyValue">1</strong>
          <button type="button" id="qtyPlus">+</button>
        </div>
      </div>
      <div class="control-box bonus-box">
        <label for="diceBonus">Bônus / Modificador</label>
        <div class="bonus-input">
          <span id="bonusSign">+</span>
          <input id="diceBonus" type="number" value="0" step="1" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="roll-big digital-dice" id="rollDisplay">
      <div class="roll-formula" id="rollFormula">1D2 + 0</div>
      <div class="roll-number" id="rollNumber">—</div>
      <div class="roll-label" id="rollLabel">Azul • pronto para rolar</div>
      <div class="roll-parts" id="rollParts"></div>
    </div>

    <div class="dice-actions">
      <button class="btn primary" id="rollBtn">🎲 ROLAR DADO</button>
      <button class="btn gray" id="clearDiceBtn">Limpar histórico</button>
    </div>
  </div>

  <div class="dice-panel">
    <h2>Histórico</h2>
    <div id="diceHistory" class="roll-history">
      <div><span>Nenhuma rolagem ainda.</span><span>🎲</span></div>
    </div>
  </div>
</section>
</main><footer><button class="btn gray" id="resetBtn">↺ Restaurar combate</button><button class="btn primary" id="newBtn">＋ Personagem</button></footer></div><script type="module">const KEY='oraculo-batalha-v1';let players=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function save(){localStorage.setItem(KEY,JSON.stringify(players));render()}function uid(){return Date.now()+Math.random().toString(16).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function get(id){return players.find(p=>p.id===id)}function log(p,t){p.log=p.log||[];p.log.unshift(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' • '+t);p.log=p.log.slice(0,30)}function render(){let b=$('playerList');if(!players.length){b.innerHTML='<div class="panel empty">Nenhum personagem cadastrado.<br>Crie o primeiro para começar o combate.</div>';return}b.innerHTML=players.map(p=>{let hp=clamp(p.hp/p.hpMax*100,0,100),mp=p.mpMax?clamp(p.mp/p.mpMax*100,0,100):0;return `<article class="character"><div class="topline"><div><div class="name">${esc(p.name)}</div><div style="color:#8f98a5">${esc(p.className||'')} ${p.race?'• '+esc(p.race):''}</div></div><div class="initiative">⚡ ${p.init}</div></div><div class="bars"><div class="barwrap"><div class="barhead"><span>❤️ PV</span><b>${p.hp}/${p.hpMax}</b></div><div class="bar"><div class="fill hp" style="width:${hp}%"></div></div></div><div class="barwrap"><div class="barhead"><span>🔷 Mana</span><b>${p.mp}/${p.mpMax}</b></div><div class="bar"><div class="fill mp" style="width:${mp}%"></div></div></div></div><div class="actions"><button class="btn red" onclick="damage('${p.id}')">− Dano</button><button class="btn primary" onclick="heal('${p.id}')">＋ Cura</button><button class="btn purple" onclick="spend('${p.id}')">− Mana</button><button class="btn blue" onclick="recover('${p.id}')">＋ Mana</button><button class="btn gray" onclick="editInit('${p.id}')">⚡ Init.</button><button class="btn gray" onclick="resetPlayer('${p.id}')">↺ Restaurar</button><button class="btn gray" onclick="addAction('${p.id}')">＋ Ação</button><button class="btn gray" onclick="removePlayer('${p.id}')">Excluir</button></div><div class="resistance"><div class="res-title">🎲 Testes de Resistência</div><div class="res-grid"><button class="res-btn" onclick="resistanceTest('${p.id}','fort')">🛡️ Fortitude<span>+${p.fort}</span></button><button class="res-btn" onclick="resistanceTest('${p.id}','ref')">⚡ Reflexos<span>+${p.ref}</span></button><button class="res-btn" onclick="resistanceTest('${p.id}','will')">🧠 Vontade<span>+${p.will}</span></button></div>${p.lastRoll?'<div class="roll-result">Último: <strong>'+esc(p.lastRoll.name)+'</strong> • d20 '+p.lastRoll.d20+' + '+p.lastRoll.bonus+' = <strong>'+p.lastRoll.total+'</strong>'+(p.lastRoll.cd!==null?' • CD '+p.lastRoll.cd+' • <strong style="color:'+(p.lastRoll.success?'var(--accent)':'var(--red)')+'">'+(p.lastRoll.success?'SUCESSO':'FALHA')+'</strong>':'')+'</div>':''}</div><div class="statgrid"><div class="stat"><b>${p.def}</b><span>Defesa</span></div><div class="stat"><b>${p.fort}</b><span>Fortitude</span></div><div class="stat"><b>${p.ref}</b><span>Reflexos</span></div><div class="stat"><b>${p.will}</b><span>Vontade</span></div><div class="stat"><b>${p.hpMax}</b><span>PV Máx.</span></div><div class="stat"><b>${p.mpMax}</b><span>Mana Máx.</span></div></div>${p.actions?.length?'<div class="combat"><b>⚔ Ações</b>'+p.actions.map(a=>'<div style="margin-top:6px;color:#b9c0c9">• '+esc(a)+'</div>').join('')+'</div>':''}${p.log?.length?'<div class="combat"><b>Histórico</b><div class="log">'+p.log.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div></div>':''}</article>`}).join('')}window.resistanceTest=(id,type)=>{
 const p=get(id);
 const data={fort:{name:'Fortitude',bonus:Number(p.fort)||0},ref:{name:'Reflexos',bonus:Number(p.ref)||0},will:{name:'Vontade',bonus:Number(p.will)||0}}[type];
 if(!data)return;
 const cdRaw=prompt('CD do teste de '+data.name+' (deixe vazio para apenas rolar):','');
 if(cdRaw===null)return;
 const cd=cdRaw.trim()===''?null:Number(cdRaw);
 if(cd!==null&&!Number.isFinite(cd)){alert('CD inválida.');return}
 const d20=Math.floor(Math.random()*20)+1;
 const total=d20+data.bonus;
 const success=cd===null?null:total>=cd;
 p.lastRoll={name:data.name,d20,bonus:data.bonus,total,cd,success};
 log(p,'Teste de '+data.name+': d20 '+d20+' + '+data.bonus+' = '+total+(cd!==null?' contra CD '+cd+' ('+(success?'sucesso':'falha')+')':''));
 save();
};

 PV e Mana de todos?')){players.forEach(p=>{p.hp=p.hpMax;p.mp=p.mpMax});save()}};$('newBtn').onclick=()=>showTab('create');function showTab(tab){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===tab));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));scrollTo(0,0)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));render();

let selectedSides=2;
let selectedColor='Azul';
let diceQty=1;
let diceHistory=JSON.parse(localStorage.getItem('oraculo-dice-history')||'[]');

function updateDiceUI(){
  const qtyEl=document.getElementById('diceQtyValue');
  const bonusEl=document.getElementById('diceBonus');
  const signEl=document.getElementById('bonusSign');
  const formulaEl=document.getElementById('rollFormula');
  const labelEl=document.getElementById('rollLabel');
  if(!qtyEl||!bonusEl||!signEl||!formulaEl||!labelEl)return;

  const bonus=Number(bonusEl.value)||0;
  qtyEl.textContent=diceQty;
  signEl.textContent=bonus<0?'−':'+';
  formulaEl.textContent=diceQty+'D'+selectedSides+(bonus<0?' − '+Math.abs(bonus):' + '+bonus);
  labelEl.textContent=selectedColor+' • pronto para rolar';
}

function renderDiceHistory(){
  const box=document.getElementById('diceHistory');
  if(!box)return;
  if(!diceHistory.length){
    box.innerHTML='<div><span>Nenhuma rolagem ainda.</span><span>🎲</span></div>';
    return;
  }
  box.innerHTML=diceHistory.slice(0,40).map(function(r){
    const mod=(r.bonus<0?' − '+Math.abs(r.bonus):' + '+r.bonus);
    return '<div><span><b>'+esc(r.total)+'</b> • '+r.qty+'D'+r.sides+mod+' • '+esc(r.color)+'</span><span>'+esc(r.time)+'</span></div>';
  }).join('');
}

document.querySelectorAll('.die').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.die').forEach(function(x){x.classList.remove('selected')});
    btn.classList.add('selected');
    selectedSides=Number(btn.dataset.sides)||2;
    updateDiceUI();
  });
});

document.querySelectorAll('.color').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.color').forEach(function(x){x.classList.remove('selected')});
    btn.classList.add('selected');
    selectedColor=btn.dataset.color||'Azul';
    updateDiceUI();
  });
});

const qtyMinus=document.getElementById('qtyMinus');
const qtyPlus=document.getElementById('qtyPlus');
const bonusInput=document.getElementById('diceBonus');
const rollBtn=document.getElementById('rollBtn');
const clearDiceBtn=document.getElementById('clearDiceBtn');

if(qtyMinus)qtyMinus.addEventListener('click',function(){
  diceQty=Math.max(1,diceQty-1);
  updateDiceUI();
});
if(qtyPlus)qtyPlus.addEventListener('click',function(){
  diceQty=Math.min(99,diceQty+1);
  updateDiceUI();
});
if(bonusInput)bonusInput.addEventListener('input',updateDiceUI);

let diceRolling=false;

if(rollBtn)rollBtn.addEventListener('click',function(){
  if(diceRolling)return;
  diceRolling=true;

  const bonus=Number(bonusInput.value)||0;
  const rolls=[];
  for(let i=0;i<diceQty;i++){
    rolls.push(Math.floor(Math.random()*selectedSides)+1);
  }
  const diceTotal=rolls.reduce(function(sum,n){return sum+n},0);
  const total=diceTotal+bonus;

  const display=document.getElementById('rollDisplay');
  const numberEl=document.getElementById('rollNumber');
  const labelEl=document.getElementById('rollLabel');
  const partsEl=document.getElementById('rollParts');

  display.classList.add('rolling');
  rollBtn.disabled=true;
  rollBtn.textContent='🎲 ROLANDO...';
  labelEl.textContent=selectedColor+' • os dados estão rolando...';
  partsEl.innerHTML='';

  const started=Date.now();
  const duration=850;

  const animate=()=>{
    const elapsed=Date.now()-started;
    const progress=Math.min(1,elapsed/duration);

    // Mostra números aleatórios rapidamente durante a animação.
    const fakeMax=Math.max(2,Math.min(999,selectedSides*diceQty+Math.abs(bonus)));
    numberEl.textContent=Math.floor(Math.random()*fakeMax)+1;

    if(progress<1){
      requestAnimationFrame(animate);
    }else{
      numberEl.textContent=total;
      labelEl.textContent=selectedColor+' • resultado total';
      partsEl.innerHTML=rolls.map(function(n,i){
        return '<span class="roll-part reveal" style="animation-delay:'+(i*55)+'ms">#'+(i+1)+' '+n+'</span>';
      }).join('');

      display.classList.remove('rolling');
      rollBtn.disabled=false;
      rollBtn.textContent='🎲 JOGAR DADO';
      diceRolling=false;

      diceHistory.unshift({
        total:total,
        rolls:rolls,
        qty:diceQty,
        sides:selectedSides,
        bonus:bonus,
        color:selectedColor,
        time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})
      });
      diceHistory=diceHistory.slice(0,40);
      localStorage.setItem('oraculo-dice-history',JSON.stringify(diceHistory));
      renderDiceHistory();
    }
  };

  requestAnimationFrame(animate);
});

if(clearDiceBtn)clearDiceBtn.addEventListener('click',function(){
  if(confirm('Limpar o histórico de rolagens?')){
    diceRolling=false;
    const rd=document.getElementById('rollDisplay');
    if(rd)rd.classList.remove('rolling');
    diceHistory=[];
    localStorage.setItem('oraculo-dice-history','[]');
    renderDiceHistory();
    document.getElementById('rollNumber').textContent='—';
    document.getElementById('rollParts').innerHTML='';
    updateDiceUI();
  }
});

renderDiceHistory();
updateDiceUI();

};

const firebaseApp = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const firebaseDB = getDatabase(firebaseApp);

let onlineRoomCode = (localStorage.getItem('oraculo-room') || '').toUpperCase();
let onlineUid = null;
let onlineSession = sessionStorage.getItem('oraculo-session') || (Date.now().toString(36)+Math.random().toString(36).slice(2,8));
sessionStorage.setItem('oraculo-session', onlineSession);
let roomUnsub = null;
let presenceUnsub = null;
let diceEventsUnsub = null;
let connected = false;
let applyingRemote = false;

const roomCodeEl = document.getElementById('roomCode');
const connectRoomBtn = document.getElementById('connectRoomBtn');
const onlineStatusEl = document.getElementById('onlineStatus');
const onlineDotEl = document.getElementById('onlineDot');
const onlineRoomInfoEl = document.getElementById('onlineRoomInfo');
const onlinePeopleEl = document.getElementById('onlinePeople');
const copyRoomBtn = document.getElementById('copyRoomBtn');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');

function setOnlineStatus(textValue, isOn){
  if(onlineStatusEl) onlineStatusEl.textContent = textValue;
  if(onlineDotEl) onlineDotEl.className = 'online-dot ' + (isOn ? 'on' : 'off');
}

function roomValid(code){
  return /^[A-Z0-9_-]{3,12}$/.test(code);
}

function currentState(){
  return {
    players: Array.isArray(players) ? players : [],
    diceHistory: Array.isArray(diceHistory) ? diceHistory.slice(0,40) : [],
    updatedAt: serverTimestamp(),
    updatedBy: onlineUid || null
  };
}

function localSaveOnly(){
  localStorage.setItem(KEY, JSON.stringify(players));
  localStorage.setItem('oraculo-dice-history', JSON.stringify(diceHistory || []));
}

async function publishState(extra){
  if(!onlineRoomCode || !onlineUid || !connected || applyingRemote) return;
  try{
    const state = currentState();
    if(extra && extra.event){
      state.lastEvent = extra.event;
    }
    await set(ref(firebaseDB, `rooms/${onlineRoomCode}/state`), state);
  }catch(err){
    console.error(err);
    setOnlineStatus('Erro ao sincronizar', false);
  }
}

/* Substitui o save local pelo save local + nuvem. */
save = function(){
  localSaveOnly();
  render();
  publishState();
};

async function publishDiceEvent(roll){
  if(!onlineRoomCode || !onlineUid || !connected || applyingRemote) return;
  try{
    const ev = push(ref(firebaseDB, `rooms/${onlineRoomCode}/events`));
    await set(ev, {
      type:'dice',
      uid:onlineUid,
      session:onlineSession,
      roll,
      at:serverTimestamp()
    });
  }catch(err){ console.error(err); }
}

function showRemoteDice(roll){
  const display=document.getElementById('rollDisplay');
  const numberEl=document.getElementById('rollNumber');
  const labelEl=document.getElementById('rollLabel');
  const partsEl=document.getElementById('rollParts');
  if(!display||!numberEl||!labelEl||!partsEl) return;

  display.classList.add('rolling');
  labelEl.textContent=(roll.color||'Dado')+' • rolagem de outro jogador';
  partsEl.innerHTML='';
  const started=Date.now(), duration=700;
  const animate=()=>{
    const elapsed=Date.now()-started;
    const progress=Math.min(1,elapsed/duration);
    numberEl.textContent=Math.floor(Math.random()*Math.max(2,(roll.sides||20)*(roll.qty||1)))+1;
    if(progress<1) requestAnimationFrame(animate);
    else{
      numberEl.textContent=roll.total;
      labelEl.textContent=(roll.color||'Dado')+' • resultado recebido';
      partsEl.innerHTML=(roll.rolls||[]).map((n,i)=>'<span class="roll-part reveal" style="animation-delay:'+(i*55)+'ms">#'+(i+1)+' '+n+'</span>').join('');
      display.classList.remove('rolling');
      display.classList.add('sync-flash');
      setTimeout(()=>display.classList.remove('sync-flash'),600);
    }
  };
  requestAnimationFrame(animate);
}

async function leaveRoom(){
  const oldRoom=onlineRoomCode;
  try{
    if(presenceUnsub) { presenceUnsub(); presenceUnsub=null; }
    if(roomUnsub) { roomUnsub(); roomUnsub=null; }
    if(diceEventsUnsub) { diceEventsUnsub(); diceEventsUnsub=null; }

    if(oldRoom && onlineUid && onlineSession){
      try{
        await set(ref(firebaseDB, `rooms/${oldRoom}/presence/${onlineUid}/${onlineSession}`), null);
      }catch(err){ console.warn('Não foi possível remover a presença imediatamente:',err); }
    }
  }finally{
    onlineRoomCode='';
    localStorage.removeItem('oraculo-room');
    if(roomCodeEl) roomCodeEl.value='';
    if(onlineRoomInfoEl) onlineRoomInfoEl.textContent='Nenhuma sala conectada.';
    if(onlinePeopleEl) onlinePeopleEl.textContent='👥 0 dispositivo(s) conectado(s)';
    if(copyRoomBtn) copyRoomBtn.style.display='none';
    if(leaveRoomBtn) leaveRoomBtn.style.display='none';
    if(connectRoomBtn){ connectRoomBtn.textContent='Conectar'; connectRoomBtn.disabled=false; }
    setOnlineStatus('Desconectado',false);
    window.__lastRemoteDiceEvent=null;
  }
}

async function connectToRoom(code){
  code=(code||'').trim().toUpperCase();
  if(!roomValid(code)){ alert('Use um código de sala com 3 a 12 caracteres: letras, números, _ ou -.'); return; }
  if(!onlineUid){ alert('Ainda conectando sua conta anônima ao Firebase. Tente novamente em alguns segundos.'); return; }

  if(roomUnsub) { roomUnsub(); roomUnsub=null; }
  if(presenceUnsub) { presenceUnsub(); presenceUnsub=null; }
  if(diceEventsUnsub) { diceEventsUnsub(); diceEventsUnsub=null; }

  onlineRoomCode=code;
  localStorage.setItem('oraculo-room',code);
  roomCodeEl.value=code;
  connectRoomBtn.textContent='Conectando...';
  connectRoomBtn.disabled=true;
  setOnlineStatus('Entrando na sala...',false);

  const stateRef=ref(firebaseDB,`rooms/${code}/state`);
  let firstSnapshot=true;

  roomUnsub=onValue(stateRef, async snap=>{
    const remote=snap.val();

    if(remote && remote.players){
      applyingRemote=true;
      players=Array.isArray(remote.players) ? remote.players : Object.values(remote.players||{});
      diceHistory=Array.isArray(remote.diceHistory) ? remote.diceHistory : Object.values(remote.diceHistory||{});
      localSaveOnly();
      render();
      renderDiceHistory();
      updateDiceUI();
      applyingRemote=false;
      if(firstSnapshot) setOnlineStatus('Sincronizado',true);
    }else if(firstSnapshot){
      await publishState();
      setOnlineStatus('Sala criada',true);
    }
    firstSnapshot=false;
  });

  const presenceRef=ref(firebaseDB,`rooms/${code}/presence/${onlineUid}/${onlineSession}`);
  await onDisconnect(presenceRef).remove();
  await set(presenceRef,{uid:onlineUid,session:onlineSession,connectedAt:serverTimestamp()});

  presenceUnsub=onValue(ref(firebaseDB,`rooms/${code}/presence`),snap=>{
    const val=snap.val()||{};
    let count=0;
    Object.values(val).forEach(user=>{ count += Object.keys(user||{}).length; });
    onlinePeopleEl.textContent='👥 '+count+' dispositivo(s) conectado(s)';
  });

  diceEventsUnsub=onValue(ref(firebaseDB,`rooms/${code}/events`),snap=>{
    const events=snap.val()||{};
    const list=Object.values(events).sort((a,b)=>(a?.at||0)-(b?.at||0));
    const latest=list[list.length-1];
    if(latest && latest.uid!==onlineUid && latest.session!==onlineSession && latest.roll){
      const eventKey=Object.keys(events).sort().pop();
      if(eventKey!==window.__lastRemoteDiceEvent){
        window.__lastRemoteDiceEvent=eventKey;
        showRemoteDice(latest.roll);
      }
    }
  });

  onlineRoomInfoEl.innerHTML='Sala <b>'+esc(code)+'</b> • estado compartilhado em tempo real';
  copyRoomBtn.style.display='block';
  if(leaveRoomBtn) leaveRoomBtn.style.display='block';
  connectRoomBtn.textContent='Conectado';
  connectRoomBtn.disabled=false;
}

connectRoomBtn.addEventListener('click',()=>connectToRoom(roomCodeEl.value));
roomCodeEl.addEventListener('keydown',e=>{if(e.key==='Enter')connectToRoom(roomCodeEl.value)});
copyRoomBtn.addEventListener('click',async()=>{
  if(!onlineRoomCode)return;
  try{
    await navigator.clipboard.writeText(onlineRoomCode);
    copyRoomBtn.textContent='Copiado!';
    setTimeout(()=>copyRoomBtn.textContent='Copiar',1200);

});

leaveRoomBtn?.addEventListener('click',leaveRoom);

onValue(ref(firebaseDB,'.info/connected'),snap=>{

    setOnlineStatus('Sem conexão',false);
  }
});

onAuthStateChanged(firebaseAuth,user=>{
  if(user){
    onlineUid=user.uid;
    if(onlineRoomCode && roomValid(onlineRoomCode)) connectToRoom(onlineRoomCode);

});

signInAnonymously(firebaseAuth).catch(err=>{
  console.error(err);
  setOnlineStatus('Falha na autenticação',false);
  onlineRoomInfoEl.textContent='Ative o login anônimo no Firebase Authentication.';
});

window.OraculoOnline={
