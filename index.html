<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><meta name="apple-mobile-web-app-capable" content="yes"><title>Oráculo de Batalha</title><style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');:root{--bg:#080a0d;--panel:#111419;--card:#171a20;--line:#282d35;--text:#f1f4f7;--muted:#8f98a5;--accent:#55d66b;--blue:#3da5ff;--red:#ff4b4b;--purple:#b54cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#161a21 0,#080a0d 42%);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;min-height:100vh}.app{max-width:760px;margin:auto;padding-bottom:90px}header{padding:24px 16px 14px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:rgba(8,10,13,.94);backdrop-filter:blur(14px)}.logo{font-size:27px;font-weight:700;letter-spacing:2px}.subtitle{color:var(--muted);font-size:13px;letter-spacing:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:#101318;padding:4px;border-radius:14px;border:1px solid var(--line)}.tab{padding:11px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:#22272e;color:white}main{padding:16px}.section{display:none}.section.active{display:block}.panel{background:rgba(20,23,28,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 12px 35px #0005}h2{margin:0 0 14px;font-size:20px}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input{width:100%;background:#0d1014;color:var(--text);border:1px solid #303640;border-radius:11px;padding:12px;outline:none}input:focus{border-color:var(--blue)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{padding:11px 14px;border-radius:11px;background:#252a31;color:white;font-weight:700}.btn.primary{background:var(--accent);color:#071008}.btn.blue{background:var(--blue);color:#06111c}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}.btn.gray{background:#30353d}.btn.small{padding:8px 10px;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:40px 15px}.character{background:linear-gradient(145deg,#1b1f25,#13161b);border:1px solid #2c323b;border-radius:20px;padding:16px;margin-bottom:14px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:25px;font-weight:700}.initiative{color:var(--blue);font-size:17px;font-weight:700}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.barwrap{background:#0d1014;border-radius:12px;padding:10px}.barhead{display:flex;justify-content:space-between;margin-bottom:7px;font-size:14px}.bar{height:10px;background:#282d35;border-radius:99px;overflow:hidden}.fill{height:100%;transition:.25s}.hp{background:var(--red)}.mp{background:var(--blue)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#0d1014;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:12px}.combat{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.log{font-size:13px;color:var(--muted);max-height:120px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #1f232a}footer{position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,13,.95);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;backdrop-filter:blur(14px)}footer button{flex:1}@media(max-width:500px){.grid3{grid-template-columns:1fr 1fr}.bars{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.logo{font-size:23px}}.resistance{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.res-title{font-weight:700;margin-bottom:9px}.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.res-btn{background:#20262e;color:#fff;border:1px solid #343b45;padding:10px 6px;border-radius:10px;font-weight:700}.res-btn span{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.roll-result{margin-top:9px;background:#0d1014;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:14px}.roll-result strong{color:var(--blue)}

.d4{background:linear-gradient(145deg,#8b5cf6,#5b21b6)}.d6{background:linear-gradient(145deg,#ef4444,#991b1b)}

.c-red{background:#ef4444}.c-blue{background:#3b82f6}.c-green{background:#22c55e}.c-purple{background:#a855f7}.c-gold{background:#f59e0b}.c-cyan{background:#06b6d4}.c-pink{background:#ec4899}.c-white{background:#e5e7eb}

.d2{background:linear-gradient(145deg,#64748b,#334155)}
.d3{background:linear-gradient(145deg,#14b8a6,#0f766e)}

.die{min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.die.selected{border-color:#fff8}
.dice-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.control-box{background:#0d1014;border:1px solid var(--line);border-radius:14px;padding:10px}
.control-box label{margin:0 0 7px}
.stepper{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.stepper button{height:42px;border-radius:10px;background:#252b33;color:#fff;font-size:23px}

.bonus-input{display:grid;grid-template-columns:25px 1fr;align-items:center}
.bonus-input span{text-align:center;color:var(--accent);font-size:20px;font-weight:700}
.bonus-input input{height:42px;text-align:center;font-size:18px}
.roll-formula{font-size:14px;color:var(--muted);letter-spacing:1px;margin-bottom:5px}
.roll-parts{margin-top:11px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.roll-big.rolling {
  animation: diceShake .08s linear infinite, diceGlow .7s ease-in-out infinite alternate;
  transform-origin: center;
}
.roll-big.rolling .roll-number {
  animation: numberPulse .08s linear infinite;
}
@keyframes diceShake {
  0% { transform: rotate(-1deg) scale(1.01); }
  50% { transform: rotate(1deg) scale(1.045); }
  100% { transform: rotate(-1deg) scale(1.01); }
}
@keyframes diceGlow {
  from { box-shadow: 0 0 0 rgba(61,165,255,0), inset 0 0 0 rgba(61,165,255,0); }
  to { box-shadow: 0 0 28px rgba(61,165,255,.22), inset 0 0 22px rgba(61,165,255,.08); }
}
@keyframes numberPulse {
  0% { opacity:.65; transform:scale(.94); }
  50% { opacity:1; transform:scale(1.08); }
  100% { opacity:.65; transform:scale(.94); }
}
.roll-part.reveal {
  animation: partReveal .28s ease-out both;
}
@keyframes partReveal {
  from { opacity:0; transform:translateY(8px) scale(.8); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.roll-part{background:#20262e;border:1px solid #343b45;border-radius:8px;padding:5px 8px;font-size:13px}

<style>

@media(max-width:500px){.online-grid{grid-template-columns:1fr}}

<div class="online-panel">

</div><main><section id="players" class="section active"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Iniciativa</h2><button class="btn small blue" id="sortBtn">↕ Ordenar</button></div><div id="playerList"></div></section><section id="create" class="section"><div class="panel"><h2>✦ Criar personagem</h2><label>Nome</label><input id="name" placeholder="Ex.: Eryndor"><div class="grid2"><div><label>Classe</label><input id="class" placeholder="Ex.: Arqueiro"></div><div><label>Raça</label><input id="race" placeholder="Ex.: Humano"></div></div><div class="grid3"><div><label>PV Máx.</label><input id="hp" type="number" value="45"></div><div><label>Mana Máx.</label><input id="mp" type="number" value="25"></div><div><label>Iniciativa</label><input id="init" type="number" value="10"></div></div><div class="grid3"><div><label>Defesa</label><input id="def" type="number" value="10"></div><div><label>Fortitude</label><input id="fort" type="number" value="0"></div><div><label>Reflexos</label><input id="ref" type="number" value="0"></div></div><label>Vontade</label><input id="will" type="number" value="0"><div class="row" style="margin-top:16px"><button class="btn primary" id="createBtn">＋ Cadastrar</button><button class="btn gray" id="clearBtn">Limpar</button></div></div></section>

</main><footer><button class="btn gray" id="resetBtn">↺ Restaurar combate</button><button class="btn primary" id="newBtn">＋ Personagem</button></footer></div><script type="module">const KEY='oraculo-batalha-v1';let players=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function save(){localStorage.setItem(KEY,JSON.stringify(players));render()}function uid(){return Date.now()+Math.random().toString(16).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function get(id){return players.find(p=>p.id===id)}function log(p,t){p.log=p.log||[];p.log.unshift(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' • '+t);p.log=p.log.slice(0,30)}function render(){let b=$('playerList');if(!players.length){b.innerHTML='<div class="panel empty">Nenhum personagem cadastrado.<br>Crie o primeiro para começar o combate.</div>';return}b.innerHTML=players.map(p=>{let hp=clamp(p.hp/p.hpMax*100,0,100),mp=p.mpMax?clamp(p.mp/p.mpMax*100,0,100):0;return `<article class="character"><div class="topline"><div><div class="name">${esc(p.name)}</div><div style="color:#8f98a5">${esc(p.className||'')} ${p.race?'• '+esc(p.race):''}</div></div><div class="initiative">⚡ ${p.init}</div></div><div class="bars"><div class="barwrap"><div class="barhead"><span>❤️ PV</span><b>${p.hp}/${p.hpMax}</b></div><div class="bar"><div class="fill hp" style="width:${hp}%"></div></div></div><div class="barwrap"><div class="barhead"><span>🔷 Mana</span><b>${p.mp}/${p.mpMax}</b></div><div class="bar"><div class="fill mp" style="width:${mp}%"></div></div></div></div><div class="actions"><button class="btn red" onclick="damage('${p.id}')">− Dano</button><button class="btn primary" onclick="heal('${p.id}')">＋ Cura</button><button class="btn purple" onclick="spend('${p.id}')">− Mana</button><button class="btn blue" onclick="recover('${p.id}')">＋ Mana</button><button class="btn gray" onclick="editInit('${p.id}')">⚡ Init.</button><button class="btn gray" onclick="resetPlayer('${p.id}')">↺ Restaurar</button><button class="btn gray" onclick="addAction('${p.id}')">＋ Ação</button><button class="btn gray" onclick="removePlayer('${p.id}')">Excluir</button></div><div class="resistance"><div class="res-title">🎲 Testes de Resistência</div><div class="res-grid"><button class="res-btn" onclick="resistanceTest('${p.id}','fort')">🛡️ Fortitude<span>+${p.fort}</span></button><button class="res-btn" onclick="resistanceTest('${p.id}','ref')">⚡ Reflexos<span>+${p.ref}</span></button><button class="res-btn" onclick="resistanceTest('${p.id}','will')">🧠 Vontade<span>+${p.will}</span></button></div>${p.lastRoll?'<div class="roll-result">Último: <strong>'+esc(p.lastRoll.name)+'</strong> • d20 '+p.lastRoll.d20+' + '+p.lastRoll.bonus+' = <strong>'+p.lastRoll.total+'</strong>'+(p.lastRoll.cd!==null?' • CD '+p.lastRoll.cd+' • <strong style="color:'+(p.lastRoll.success?'var(--accent)':'var(--red)')+'">'+(p.lastRoll.success?'SUCESSO':'FALHA')+'</strong>':'')+'</div>':''}</div><div class="statgrid"><div class="stat"><b>${p.def}</b><span>Defesa</span></div><div class="stat"><b>${p.fort}</b><span>Fortitude</span></div><div class="stat"><b>${p.ref}</b><span>Reflexos</span></div><div class="stat"><b>${p.will}</b><span>Vontade</span></div><div class="stat"><b>${p.hpMax}</b><span>PV Máx.</span></div><div class="stat"><b>${p.mpMax}</b><span>Mana Máx.</span></div></div>${p.actions?.length?'<div class="combat"><b>⚔ Ações</b>'+p.actions.map(a=>'<div style="margin-top:6px;color:#b9c0c9">• '+esc(a)+'</div>').join('')+'</div>':''}${p.log?.length?'<div class="combat"><b>Histórico</b><div class="log">'+p.log.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div></div>':''}</article>`}).join('')}window.resistanceTest=(id,type)=>{
 const p=get(id);
 const data={fort:{name:'Fortitude',bonus:Number(p.fort)||0},ref:{name:'Reflexos',bonus:Number(p.ref)||0},will:{name:'Vontade',bonus:Number(p.will)||0}}[type];
 if(!data)return;
 con
